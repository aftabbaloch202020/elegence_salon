<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Menu & Catalog — Elegance Salon</title>
  <meta name="description" content="Explore our bespoke menu of luxury haircuts, balayage, keratin treatments, hydra facials, manicure/pedicure rituals, and bridal artistry.">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="services">
  <div class="section">
    <div class="container">
      <div style="max-width:640px; margin-bottom:28px">
        <span class="eyebrow">The Menu</span>
        <h1 style="margin-bottom:8px">Services & Treatments</h1>
        <p style="font-size:1.05rem">Hair, skin, nails, and ceremonial glam — timed, priced, and crafted with clinical care and quiet luxury.</p>
      </div>

      <div class="filters" style="margin-bottom:28px; display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between">
        <div style="position:relative; width:min(360px, 100%)">
          <input class="search-input" id="svc-search" placeholder="Search services (e.g. Balayage)..." style="width:100%; border-radius:999px; padding:11px 18px 11px 40px">
          <i class="fa-solid fa-magnifying-glass" style="position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--muted)"></i>
        </div>
        <div id="svc-cats" class="filters" style="margin:0"></div>
      </div>

      <div class="grid-3" id="service-catalog"></div>
    </div>
  </div>
  <script src="js/mock-data.js"></script><script src="js/store.js"></script><script src="js/app.js"></script><script src="js/layout.js"></script><script src="js/main.js"></script>
  <script>Layout.public("services");</script>
</body>
</html>
