<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Elegance Salon</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="forgot">
  <div class="auth-split">
    <div class="auth-visual">
      <img src="https://images.unsplash.com/photo-1570172619604-71d0ac1d5d8f?auto=format&fit=crop&w=1400&q=80" alt="Spa facial setting">
      <div class="auth-copy"><h2>We’ll send a reset link</h2><p>Enter your registered email to receive password recovery instructions.</p></div>
    </div>
    <div class="auth-panel">
      <form class="auth-card" id="forgot-form">
        <a href="login.html" class="eyebrow">← Back to Login</a>
        <h1>Reset password</h1>
        <div class="field"><label for="email">Email</label><input id="email" type="email" required><div class="field-error">Email required</div></div>
        <button class="btn btn-gold btn-block" type="submit">Send Reset Link</button>
        <div class="alert alert-success" id="forgot-success" hidden>Reset link sent. Check your inbox for instructions.</div>
      </form>
    </div>
  </div>
  <script src="js/mock-data.js"></script><script src="js/store.js"></script><script src="js/app.js"></script><script src="js/main.js"></script>
</body>
</html>
